<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Response Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="url"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        .method-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .method-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            color: #333;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .method-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .response-section {
            margin-top: 30px;
        }

        .response-section h2 {
            font-size: 16px;
            color: #666;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #response {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #333;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.loading {
            background: #cce5ff;
            color: #004085;
        }

        .info-text {
            color: #999;
            font-size: 12px;
            margin-top: 30px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Server Response Tester</h1>
        
        <div class="input-group">
            <input type="url" id="urlInput" placeholder="Enter API endpoint (e.g., https://api.example.com/data)" value="https://jsonplaceholder.typicode.com/posts/1">
            <button onclick="sendRequest()">Send</button>
        </div>

        <div class="method-buttons">
            <button class="method-btn active" onclick="setMethod('GET')">GET</button>
            <button class="method-btn" onclick="setMethod('POST')">POST</button>
            <button class="method-btn" onclick="setMethod('PUT')">PUT</button>
            <button class="method-btn" onclick="setMethod('DELETE')">DELETE</button>
        </div>

        <div class="response-section">
            <h2>Response</h2>
            <div id="statusDisplay"></div>
            <div id="response">Waiting for request...</div>
        </div>

        <div class="info-text">
            💡 Try the default endpoint to see it in action, or enter your own API endpoint
        </div>
    </div>

    <script>
        let currentMethod = 'GET';

        function setMethod(method) {
            currentMethod = method;
            document.querySelectorAll('.method-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        async function sendRequest() {
            const url = document.getElementById('urlInput').value;
            const responseDiv = document.getElementById('response');
            const statusDisplay = document.getElementById('statusDisplay');

            if (!url) {
                responseDiv.textContent = '❌ Please enter a valid URL';
                statusDisplay.innerHTML = '';
                return;
            }

            statusDisplay.innerHTML = '<div class="status loading">⏳ Loading...</div>';
            responseDiv.textContent = 'Sending request...';

            try {
                const options = {
                    method: currentMethod,
                    headers: {
                        'Content-Type': 'application/json'
                    }
                };

                const startTime = performance.now();
                const response = await fetch(url, options);
                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);

                const data = await response.text();
                const contentType = response.headers.get('content-type');

                let formattedResponse = '';
                formattedResponse += `Status: ${response.status} ${response.statusText}\n`;
                formattedResponse += `Duration: ${duration}ms\n`;
                formattedResponse += `Content-Type: ${contentType || 'Not specified'}\n`;
                formattedResponse += `\n`;

                try {
                    const jsonData = JSON.parse(data);
                    formattedResponse += JSON.stringify(jsonData, null, 2);
                } catch {
                    formattedResponse += data;
                }

                responseDiv.textContent = formattedResponse;

                if (response.ok) {
                    statusDisplay.innerHTML = `<div class="status success">✅ Success (${response.status})</div>`;
                } else {
                    statusDisplay.innerHTML = `<div class="status error">⚠️ Error (${response.status})</div>`;
                }
            } catch (error) {
                responseDiv.textContent = `❌ Error: ${error.message}\n\nMake sure the URL is correct and CORS is enabled.`;
                statusDisplay.innerHTML = '<div class="status error">❌ Request Failed</div>';
            }
        }

        document.getElementById('urlInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendRequest();
            }
        });

        // Load default response on page load
        window.addEventListener('load', function() {
            sendRequest();
        });
    </script>
</body>
</html>
